    <!-- Script Real-Time Gold Spot Market Data -->
    <script>
        async function fetchRealMarketData() {
            try {
                // Tarik data terus dari Gold Spot API (XAU/USD Sebenar)
                const response = await fetch('https://api.gold-api.com/price/XAU');
                const data = await response.json();

                if (data && data.price) {
                    const price = parseFloat(data.price);
                    
                    // Anggaran High/Low berdasarkan volatiliti spot harian
                    const high = price + 15.20;
                    const low = price - 15.30;
                    const change = data.chp || -0.88; 

                    // Update Harga Utama
                    document.getElementById('live-price').innerText = `$${price.toFixed(2)}`;
                    document.getElementById('high-price').innerText = `$${high.toFixed(2)}`;
                    document.getElementById('low-price').innerText = `$${low.toFixed(2)}`;

                    // Update Peratusan Perubahan
                    const changeEl = document.getElementById('price-change');
                    changeEl.innerText = `${change >= 0 ? '+' : ''}${change.toFixed(2)}%`;
                    changeEl.className = `text-sm font-semibold ${change >= 0 ? 'text-green-400' : 'text-red-400'}`;

                    // Update Paras Isyarat AI Mengikut Spot Price Sebenar
                    document.getElementById('entry-price').innerText = `$${price.toFixed(2)}`;
                    document.getElementById('tp1-price').innerText = `$${(price + 8.00).toFixed(2)}`;
                    document.getElementById('tp2-price').innerText = `$${(price + 16.00).toFixed(2)}`;
                    document.getElementById('sl-price').innerText = `$${(price - 6.00).toFixed(2)}`;

                    // Update Masa
                    const now = new Date();
                    document.getElementById('signal-time').innerText = now.toLocaleTimeString();
                }
            } catch (error) {
                console.error("Gagal menarik harga Gold Spot:", error);
            }
        }

        // Tarik data serta-merta dan kemaskini setiap 3 saat
        fetchRealMarketData();
        setInterval(fetchRealMarketData, 3000);
    </script>
