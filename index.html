    <script>

        var selectedTimeframe = 'M15';

        var tfDatabase = {

                smc: 'Bullish Orderblock',
                desc: 'Timeframe M15 adalah rujukan utama zon entry Intraday dengan nisbah ketepatan tinggi.'
            },
            'H1': {
                title: 'H1 (DAY TRADE)',
                tvInterval: '60',

                entryPrice: 4133.50,

                slPrice: 4118.50,

                ema: 'Bermain Atas EMA 200',
                atr: '$22.00 (Tinggi)',
                smc: 'H1 Liquidity Sweep',
                desc: 'Timeframe H1 menentukan struktur trend harian yang kukuh bagi mengelakkan false breakout.'
            },
            'H4': {

                tvInterval: '240',
                signal: 'NEUTRAL',

                cardGlowClass: 'border-yellow-500 glow-yellow',

                validityText: 'WAITING (Sideways)',
                validityBadgeClass: 'bg-yellow-500/20 text-yellow-400 border-yellow-500/40',
                entryPrice: 4136.10,
                tp1Price: 4166.10,
                tp2Price: 4196.10,
                slPrice: 4111.10,
                rsi: '51.0 (Neutral)',
                ema: 'Ujian EMA 50 Zone',
                atr: '$38.50 (Tinggi)',
                smc: 'Sideways Range Zone',
                desc: 'Timeframe H4 sedang berada dalam zon konsolidasi (Sideways), disyorkan tunggu breakout.'
            }
        };

        function updateSignalsDynamically(price) {
            tfDatabase['M5'].entryPrice = price;
            tfDatabase['M5'].tp1Price = price + 4.00;
            tfDatabase['M5'].tp2Price = price + 8.00;
            tfDatabase['M5'].slPrice = price - 4.00;

            tfDatabase['M15'].entryPrice = price;
            tfDatabase['M15'].tp1Price = price + 10.00;
            tfDatabase['M15'].tp2Price = price + 20.00;
            tfDatabase['M15'].slPrice = price - 10.00;

            tfDatabase['H1'].entryPrice = price - 2.50;
            tfDatabase['H1'].tp1Price = price + 15.00;
            tfDatabase['H1'].tp2Price = price + 30.00;
            tfDatabase['H1'].slPrice = price - 15.00;

            tfDatabase['H4'].entryPrice = price;
            tfDatabase['H4'].tp1Price = price + 30.00;
            tfDatabase['H4'].tp2Price = price + 60.00;
            tfDatabase['H4'].slPrice = price - 25.00;

            selectTimeframe(selectedTimeframe);
        }

        function checkMarketStatus() {
            var now = new Date();
            var day = now.getUTCDay();
            var hour = now.getUTCHours();

            var isOpen = true;
            if (day === 6) {
                isOpen = false;
            } else if (day === 0 && hour < 21) {
                isOpen = false;
            } else if (day === 5 && hour >= 21) {
                isOpen = false;
            }

            var connStatus = document.getElementById('connection-status');
            var connDot = document.getElementById('connection-dot');
            var marketText = document.getElementById('market-status-text');

            if (isOpen) {
                if (connStatus) {
                    connStatus.innerText = "PASARAN DIBUKA (LIVE)";
                    connStatus.className = "text-xs font-mono font-bold text-green-400";
                }
                if (connDot) connDot.className = "inline-block w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse";
                if (marketText) {
                    marketText.innerText = "DIBUKA (LIVE)";
                    marketText.className = "text-green-400 font-bold";
                }
            } else {
                if (connStatus) {
                    connStatus.innerText = "PASARAN DITUTUP (HUJUNG MINGGU)";
                    connStatus.className = "text-xs font-mono font-bold text-red-400";
                }
                if (connDot) connDot.className = "inline-block w-2.5 h-2.5 rounded-full bg-red-500";
                if (marketText) {
                    marketText.innerText = "DITUTUP (OFF)";
                    marketText.className = "text-red-400 font-bold";
                }
            }
        }

        window.selectTimeframe = function(tfKey) {
            selectedTimeframe = tfKey;
            var data = tfDatabase[tfKey];
            if (!data) return;

            var tfs = ['M5', 'M15', 'H1', 'H4'];
            for (var i = 0; i < tfs.length; i++) {
                var k = tfs[i];
                var btn = document.getElementById('btn-tf-' + k);
                var label = document.getElementById('label-tf-' + k);

                if (k === tfKey) {
                    if (btn) btn.className = 'tf-card text-left bg-dark-bg/80 border-2 p-3.5 rounded-xl cursor-pointer ' + data.cardGlowClass;
                    if (label) {
                        label.className = 'text-green-400 font-bold';
                        label.innerText = k + ' (Aktif)';
                    }
                } else {
                    if (btn) btn.className = 'tf-card text-left bg-dark-bg/80 border border-dark-border p-3.5 rounded-xl cursor-pointer';
                    if (label) {
                        label.className = 'text-gray-400';
                        label.innerText = k;
                    }
                }
            }

            var elTitle = document.getElementById('display-tf-title');
            var elSignal = document.getElementById('display-signal-badge');
            var elConfidence = document.getElementById('display-confidence');
            var elClock = document.getElementById('display-time-clock');
            var elElapsed = document.getElementById('display-elapsed-time');
            var elValidityText = document.getElementById('display-validity-text');
            var elValidityBadge = document.getElementById('display-validity-badge');

            if (elTitle) elTitle.innerText = data.title;
            if (elSignal) {
                elSignal.innerText = data.signal;
                elSignal.className = 'px-3 py-1 rounded-lg font-bold text-2xl border ' + data.signalBadgeClass;
            }
            if (elConfidence) elConfidence.innerText = data.confidence;
            if (elClock) elClock.innerText = data.timeClock;
            if (elElapsed) elElapsed.innerText = data.elapsedText;
            if (elValidityText) elValidityText.innerText = data.validityText;
            if (elValidityBadge) elValidityBadge.className = 'px-2 py-0.5 text-[10px] font-bold rounded-full border flex items-center space-x-1 ' + data.validityBadgeClass;

            var fmt = function(num) { return '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
            
            var elEntry = document.getElementById('display-entry-price');
            var elTp1 = document.getElementById('display-tp1-price');
            var elTp2 = document.getElementById('display-tp2-price');
            var elSl = document.getElementById('display-sl-price');

            if (elEntry) elEntry.innerText = fmt(data.entryPrice);
            if (elTp1) elTp1.innerText = fmt(data.tp1Price);
            if (elTp2) elTp2.innerText = fmt(data.tp2Price);
            if (elSl) elSl.innerText = fmt(data.slPrice);

            var elChartLabel = document.getElementById('chart-tf-label');
            var elIndBadge = document.getElementById('indicator-tf-badge');
            var elRsi = document.getElementById('rsi-val');
            var elEma = document.getElementById('ema-val');
            var elAtr = document.getElementById('atr-val');
            var elSmc = document.getElementById('smc-val');
            var elDesc = document.getElementById('tf-description');

            if (elChartLabel) elChartLabel.innerText = tfKey;
            if (elIndBadge) elIndBadge.innerText = tfKey + ' DATA';
            if (elRsi) elRsi.innerText = data.rsi;
            if (elEma) elEma.innerText = data.ema;
            if (elAtr) elAtr.innerText = data.atr;
            if (elSmc) elSmc.innerText = data.smc;
            if (elDesc) elDesc.innerText = data.desc;
        };

        function updateUIPrice(newPrice) {
            currentMarketPrice = newPrice;
            var fmt = function(num) { return '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };

            var elLive = document.getElementById('live-price');
            if (elLive) elLive.innerText = fmt(currentMarketPrice);

            var diff = currentMarketPrice - previousPrice;
            var elChange = document.getElementById('price-change');
            if (elChange && previousPrice > 0) {
                var pct = (diff / previousPrice) * 100;
                elChange.innerText = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
                elChange.className = 'text-sm font-semibold ' + (pct >= 0 ? 'text-green-400' : 'text-red-400');
            }

            updateSignalsDynamically(currentMarketPrice);
        }

        // Fetch Live Price (Coinbase API - Unblocked in MY)
        async function fetchUnblockedGoldPrice() {
            try {
                const response = await fetch('https://api.coinbase.com/v2/prices/PAXG-USD/spot');
                const result = await response.json();
                if (result && result.data && result.data.amount) {
                    const price = parseFloat(result.data.amount);
                    if (!isNaN(price) && price > 0) {
                        updateUIPrice(price);
                    }
                }
            } catch (err) {
                // Fallback tick generator jika offline/no internet
                var randomTick = (Math.random() - 0.5) * 0.30;
                updateUIPrice(parseFloat((currentMarketPrice + randomTick).toFixed(2)));
            }
        }

        // CoinCap WebSocket Stream (Bebas Block)
        function connectUnblockedWebSocket() {
            checkMarketStatus();
            try {
                const ws = new WebSocket('wss://ws.coincap.io/prices?assets=pax-gold');
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data && data['pax-gold']) {
                        const price = parseFloat(data['pax-gold']);
                        updateUIPrice(price);
                    }
                };
                ws.onerror = () => {
                    // Polling fallback
                    setInterval(fetchUnblockedGoldPrice, 2000);
                };
            } catch (e) {
                setInterval(fetchUnblockedGoldPrice, 2000);
            }
        }

        // Direct Execution
        checkMarketStatus();
        fetchUnblockedGoldPrice();
        setInterval(fetchUnblockedGoldPrice, 2500); // Auto-refresh setiap 2.5 saat
        connectUnblockedWebSocket();
    </script>
